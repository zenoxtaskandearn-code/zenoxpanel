spring:
  application:
    name: remote-gallery-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gallery_platform}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-in-production-to-a-long-random-secret-value-at-least-32-bytes}
      access-token-minutes: ${JWT_ACCESS_MINUTES:30}
      refresh-token-days: ${JWT_REFRESH_DAYS:14}
      device-access-token-minutes: ${JWT_DEVICE_ACCESS_MINUTES:60}
      issuer: gallery-platform
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    registration:
      enabled: ${ADMIN_REGISTRATION_ENABLED:true}
      invite-code: ${ADMIN_REGISTRATION_INVITE_CODE:}
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:120}
  operations:
    default-expiry-minutes: ${OPERATION_EXPIRY_MINUTES:30}
  media:
    stream-base-url: ${MEDIA_STREAM_BASE_URL:}
logging:
  level:
    root: INFO
    com.gallery.platform: INFO
