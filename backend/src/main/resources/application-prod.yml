spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}

app:
  security:
    registration:
      enabled: ${ADMIN_REGISTRATION_ENABLED:false}
logging:
  level:
    root: INFO
    com.gallery.platform: INFO
